name: Validar Fechamento Central

on:
  push:
    branches: [main]
    paths:
      - 'streamlit_app.py'
      - 'central_fechamento_data.py'
      - 'report_parser.py'
      - 'cb_parser.py'
      - 'inventory_db.py'
      - 'supabase_schema.sql'
      - 'requirements.txt'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Compilar
        run: python -m py_compile streamlit_app.py central_fechamento_data.py inventory_db.py report_parser.py cb_parser.py ui.py
      - name: Validar estrutura
        run: |
          python - <<'PY'
          from pathlib import Path
          app = Path("streamlit_app.py").read_text(encoding="utf-8")
          assert app.count("st.set_page_config(") == 1
          assert "STATUS API" in app
          assert "GRAVAR FECHAMENTO DA COMPETÊNCIA" in app
          assert "render_manual_contingency" in app
          assert "def closing_date(" in app
          assert "SALVAR SALDO DO FECHAMENTO" in app
          assert '"Saldo fechamento"' in app
          assert '"Saldo atual"' in app
          assert "O saldo atual não interfere no resultado da conferência." in app
          db = Path("inventory_db.py").read_text(encoding="utf-8")
          assert "page_size = 1000" in db
          assert '"offset": str(offset)' in db
          assert "CHAPAS · ATUAL" in app
          assert "BARRAMENTOS · ATUAL" in app
          assert "FINALIZAR E REGISTRAR AJUSTES" in app
          assert "HISTÓRICO DE AJUSTES · MÊS A MÊS" in app
          assert '"Códigos consolidados"' in app
          assert '"Quantidade física"' in app
          assert "def finalize_cb_adjustments(" in db
          assert "def list_cb_adjustment_history(" in db
          assert "def list_cb_adjustment_items(" in db
          assert '"Saldo base ajuste"' in app
          assert "DETALHAR MOVIMENTAÇÃO · SALDO ATUAL × FECHAMENTO" in app
          assert "FINALIZAR CONSIDERANDO" in app
          assert "contagem_assumida_zero" in db
          assert "saldo_base_ajuste" in db
          assert "Identidade visual" not in app
          print("ESTRUTURA_OK")
          PY
      - name: Validar Analítico da Central
        run: |
          python - <<'PY'
          import central_fechamento_data as central
          from report_parser import parse_inventory_report, parse_inventory_balance_report

          meta = central.source_state()
          assert meta, "ANALÍTICO não encontrado na Central"
          raw, remote = central.download_analitico()
          name = remote.get("last_file_name") or meta.get("last_file_name") or "ANALITICO.xltx"
          parsed = parse_inventory_report(raw, name)
          balance = parse_inventory_balance_report(raw, name)
          assert parsed["total_rows"] > 0
          assert balance["total_rows"] > 0
          print(
              "ANALITICO_CENTRAL_OK",
              parsed["valid_rows"],
              parsed["invalid_rows"],
              balance["total_rows"],
          )
          PY

      - name: Validar competência de chapas
        run: |
          python - <<'PY'
          from pathlib import Path
          parser = Path("cb_parser.py").read_text(encoding="utf-8")
          app = Path("streamlit_app.py").read_text(encoding="utf-8")
          assert "table_date.month - 1" in parser
          assert "Fechamento considerado em:" in app
          print("COMPETENCIA_CHAPAS_OK")
          PY
