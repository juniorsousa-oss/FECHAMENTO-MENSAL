name: Validar Fechamento Central

on:
  push:
    branches: [main]
    paths:
      - 'streamlit_app.py'
      - 'central_fechamento_data.py'
      - 'report_parser.py'
      - 'cb_parser.py'
      - 'cb_balance_math.py'
      - 'inventory_db.py'
      - 'db.py'
      - 'ui.py'
      - 'movements.py'
      - 'movement_store.py'
      - 'kardex_history.py'
      - 'movement_analysis_ui.py'
      - 'reports.py'
      - 'reports_ui.py'
      - 'issue_check.py'
      - 'issue_check_ui.py'
      - 'issue_check_export.py'
      - 'master_plan.py'
      - 'operational_status.py'
      - 'catalog_types.py'
      - 'config/movement_rules.json'
      - 'supabase_schema.sql'
      - 'migrations/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Compilar
        run: python -m py_compile streamlit_app.py central_fechamento_data.py inventory_db.py report_parser.py cb_parser.py ui.py movements.py movement_store.py movement_analysis_ui.py issue_check.py issue_check_ui.py issue_check_export.py master_plan.py operational_status.py catalog_types.py kardex_history.py reports.py reports_ui.py cb_balance_math.py
      - name: Validar análise de movimentações
        run: python -m unittest discover -s tests -p 'test_movement_analysis*.py'
      - name: Validar relatórios centralizados
        run: python -m unittest discover -s tests -p 'test_reports.py'
      - name: Validar conferência de baixas e telas
        run: python -m unittest discover -s tests -p 'test_issue_check*.py'
      - name: Validar integração FOR001 Plano Mestre
        run: python -m unittest discover -s tests -p 'test_master_plan.py'
      - name: Validar nova lógica de estágios e alertas
        run: python -m unittest discover -s tests -p 'test_operational_status.py'
      - name: Validar tipos do CADASTROS e novos filtros da conferência
        run: python -m unittest discover -s tests -p 'test_catalog_types_filters.py'
      - name: Validar conexão paralela e cache da conferência
        run: python -m unittest discover -s tests -p 'test_cb_performance.py'
      - name: Validar soma decimal de chapas e barramentos
        run: python -m unittest discover -s tests -p 'test_cb_balance_math.py'
      - name: Validar competência de chapas por data
        run: python -m unittest discover -s tests -p 'test_cb_competencia.py'
      - name: Validar cache, carregamento sob demanda e concorrência
        run: python -m unittest discover -s tests -p 'test_runtime_performance.py'
      - name: Validar substituição mensal dos arquivos KARDEX
        run: python -m unittest discover -s tests -p 'test_kardex*.py'
      - name: Testar relatório completo de contagens
        run: python tests/test_movimentacao_todas_contagens.py
      - name: Validar estrutura
        run: |
          python - <<'PY'
          from pathlib import Path
          app = Path("streamlit_app.py").read_text(encoding="utf-8")
          assert app.count("st.set_page_config(") == 1
          assert "STATUS API" in app
          assert "GRAVAR FECHAMENTO DA COMPETÊNCIA" in app
          assert "render_manual_contingency" in app
          assert "def closing_date(" in app
          assert "SALVAR SALDO DO FECHAMENTO" in app
          assert '"Saldo fechamento"' in app
          assert '"Saldo atual"' in app
          assert "menor saldo entre Fechamento e Atual" in app
          db = Path("inventory_db.py").read_text(encoding="utf-8")
          assert "page_size = 1000" in db
          assert '"offset": str(offset)' in db
          assert "QUANTIDADE · KG" in app
          assert "SALDO ATUAL" in app
          assert "QUANTIDADE · MT" in app
          assert "FECHAMENTO · {_closing_label}" in app
          assert "FINALIZAR E REGISTRAR AJUSTES" in app
          assert "HISTÓRICO DE AJUSTES · MÊS A MÊS" in app
          assert '"Códigos consolidados"' in app
          assert '"Quantidade física"' in app
          assert "def finalize_cb_adjustments(" in db
          assert "def list_cb_adjustment_history(" in db
          assert "def list_cb_adjustment_items(" in db
          assert '"Saldo base ajuste"' in app
          assert "DETALHAR MOVIMENTAÇÃO · SALDO ATUAL × FECHAMENTO" in app
          assert "FINALIZAR CONSIDERANDO" in app
          assert "contagem_assumida_zero" in db
          assert "saldo_base_ajuste" in db
          assert "treatment_lookup" in app
          assert 'href="?pagina=' not in app
          assert 'key=f"fm_nav_{_index}"' in app
          assert "def _set_fm_page(target: str)" in app
          assert 'st.session_state["_fm_nav_collapsed"] = True' in app
          assert 'key="fm_reopen_navigation"' in app
          assert "def load_cb_page_snapshot(" in app
          assert 'if "_fm_nav_initialized" not in st.session_state' in app
          assert "def load_global_visual_config()" in app
          assert "_needs_inventory_core = page in" in app
          assert "def load_inventory_overview()" in app
          assert "@st.cache_resource" in app
          assert 'class="sidebar-status-section"' in app
          assert "sidebar-status-section" in app
          ui = Path("ui.py").read_text(encoding="utf-8")
          assert "SIDEBAR SETTA — ESTRUTURA VALIDÁVEL" in ui
          assert "SIDEBAR SETTA — BLOCO ÚNICO" not in ui
          assert "SETTA SIDEBAR SPACING LOCK — WRAPPERS STREAMLIT" not in ui
          assert 'with st.container(key="fm_sidebar_navigation")' in app
          assert 'class="sidebar-nav-label"' in app
          assert ".st-key-fm_sidebar_navigation" in ui
          assert "margin-top:24px!important" in ui
          assert "margin:0 0 12px!important" in ui
          assert "gap:6px!important" in ui
          assert "row-gap:0!important" not in ui
          assert '[data-testid="stVerticalBlock"]{\n  gap:0!important;' not in ui
          assert 'class="sidebar-status-section"' in app
          assert not Path("db.py").exists()
          assert "_saldo_codes = set(final_analysis_codes)" in app
          assert '"GERENCIAR FONTES E CONTAGENS"' in app
          assert 'def cb_stage_header(' in app
          assert 'class="cb-balance-grid"' in app
          assert 'class="cb-overview-grid"' in app
          assert app.count('cb_stage_header(') == 5
          assert 'expanded=False' in app
          assert "Identidade visual" not in app
          print("ESTRUTURA_OK")
          PY
      - name: Validar Analítico da Central
        run: |
          python - <<'PY'
          import central_fechamento_data as central
          from report_parser import parse_inventory_report, parse_inventory_balance_report

          meta = central.source_state()
          assert meta, "ANALÍTICO não encontrado na Central"
          raw, remote = central.download_analitico()
          name = remote.get("last_file_name") or meta.get("last_file_name") or "ANALITICO.xltx"
          parsed = parse_inventory_report(raw, name)
          balance = parse_inventory_balance_report(raw, name)
          assert parsed["total_rows"] > 0
          assert balance["total_rows"] > 0
          print(
              "ANALITICO_CENTRAL_OK",
              parsed["valid_rows"],
              parsed["invalid_rows"],
              balance["total_rows"],
          )
          PY

      - name: Validar competência de chapas
        run: |
          python - <<'PY'
          from pathlib import Path
          parser = Path("cb_parser.py").read_text(encoding="utf-8")
          app = Path("streamlit_app.py").read_text(encoding="utf-8")
          assert "infer_chapas_competencia(table_date)" in parser
          assert "Fechamento sugerido:" in app
          assert "ALTERAR PARA " in app
          print("COMPETENCIA_CHAPAS_OK")
          PY

      - name: SIVACON aluminum count fallback
        run: |
          python - <<'PY'
          from cb_parser import resolve_chapa_rows

          catalog = [
              {"codigo": "06000210", "categoria": "CHAPA", "ativo": True, "status": "CONFIRMADO"},
              {"codigo": "06000211", "categoria": "CHAPA", "ativo": True, "status": "CONFIRMADO"},
          ]
          rows = [
              {
                  "dimensao": "SIVACON",
                  "dimensao_norm": "SIVACON",
                  "descricao": "5mm ALUMINIO",
                  "descricao_norm": "5MM ALUMINIO",
                  "chapas": 14,
                  "peso_total": 0,
              },
              {
                  "dimensao": "SIVACON",
                  "dimensao_norm": "SIVACON",
                  "descricao": "3mm ALUMINIO",
                  "descricao_norm": "3MM ALUMINIO",
                  "chapas": 13,
                  "peso_total": 0,
              },
          ]
          result = resolve_chapa_rows(rows, [], catalog)
          by_code = {row["codigo"]: row for row in result["resolved"]}
          assert by_code["06000210"]["quantidade_fisica"] == 14
          assert by_code["06000211"]["quantidade_fisica"] == 13
          assert "CHAPAS · PC" in by_code["06000210"]["observacao"]
          print("sivacon-aluminum-piece-count-ok")
          PY
